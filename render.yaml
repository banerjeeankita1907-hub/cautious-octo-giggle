databases:
  - name: stockpilot-db
    databaseName: stockpilot
    user: stockpilot
    plan: free

services:
  - type: web
    name: stockpilot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
